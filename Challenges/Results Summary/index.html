<html>
    <head>
        <title>Results Summary</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <div class="card">
            <div class="card-left">
                <p class="result">Your Result</p>
                <div class="score-circle">
                    <h1>76</h1>
                    <p>of 100</p>
                </div>
                <h2>Great</h2>
                <p class="desc">You scored higher that 65% of the people who have taken these tests.</p>
            </div>
            <div class="card-right">
                <p class="head">Summary</p>
                <div class="result-type reaction">
                    <div class="left">
                        <img src="assets/icon-reaction.svg" style="margin-right: 7px;"/>
                        <p>Reaction</p>
                    </div>
                    <div class="score">
                        <strong>80</strong><span class="out-of"> / 100</span>
                    </div>
                </div>
                <div class="result-type memory">
                    <div class="left">
                        <img src="assets/icon-memory.svg" style="margin-right: 7px;"/>
                        <p>Memory</p>
                    </div>
                    <div class="score">
                        <strong>92</strong><span class="out-of"> / 100</span>
                    </div>
                </div>
                <div class="result-type verbal">
                    <div class="left">
                        <img src="assets/icon-verbal.svg" style="margin-right: 7px;"/>
                        <p>Verbal</p>
                    </div>
                    <div class="score">
                        <strong>61</strong><span class="out-of"> / 100</span>
                    </div>
                </div>
                <div class="result-type visual">
                    <div class="left">
                        <img src="assets/icon-visual.svg" style="margin-right: 7px;"/>
                        <p>Visual</p>
                    </div>
                    <div class="score">
                        <strong>73</strong><span class="out-of"> / 100</span>
                    </div>
                </div>
                <button class="btn">Continue</button>
            </div>
        </div>
    </body>
</html>
