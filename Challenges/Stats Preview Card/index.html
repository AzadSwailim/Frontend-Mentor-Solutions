<!DOCTYPE html>
<html>
    <head>
        <title>Stats Preview Card</title>
        <link href="style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
    <div class="card">
        <div style="padding: 70px;">
            <h1 class="head">Get <span style="color: hsl(277, 64%, 61%);">insights</span> that help your business grow.</h1>
            <p class="content">Discover the benefit of data analytics and make better decisions regarding revenue, customer experience and overall efficiency.</p>
            <div class="stats">
                <div>
                    <h1>10k+</h1>
                    <p>COMPANIES</p>
                </div>
                <div>
                    <h1>314</h1>
                    <p>TEMPLATES</p>
                </div>
                <div>
                    <h1>12M+</h1>
                    <p>QUERIES</p>
                </div>
            </div>
        </div>
        <div style="position: relative;">
            <img src="Assets/image-header-desktop.jpg" style="width: 450px; height: 100%;"/>
            <div class="overlay"></div>
        </div>
    </div>
    </body>
</html>
