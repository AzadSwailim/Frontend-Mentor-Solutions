<!DOCTYPE html>
<html>
    <head>
        <title>Product Preview Card</title>
        <link href="style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="card">
            <div>
                <img src="Assets/image-product-desktop.jpg" class="img"/>
            </div>
            <div class="card-right">
                <p class="head">Perfume</p>
                <h1 class="main">Gabrielle Essence Eau De Parfum</h1>
                <p class="desc">A floral, solar and voluptous interpretation composed by Oliver Polge, Perfume-Creator for the house of CHANEL</p>
                <div class="price">
                    <h1>$149.99</h1>
                    <p>$169.99</p>
                </div>
                <button class="btn"><img src="Assets/icon-cart.svg">
                    <span>Add to Cart</span>
                </button>
            </div>
        </div>
    </body>
</html>
