<!DOCTYPE html>
<html>
    <head>
        <title>Order Summary</title>
        <link href="style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="card">
            <img src="Assets/illustration-hero.svg" class="img"/>
            <div class="card-content">
                <h2 class="head">Order Summary</h2>
                <p class="content">You can now listen to millions of songs, audiobooks and podcasts on ant device anywhere you like! </p>
                <div class="plan-card">
                    <div style="display: flex; gap: 18px;">
                        <img src="Assets/icon-music.svg" />
                        <div>
                            <p style="color: hsl(223, 47%, 23%); font-weight: 800;">Annual Plan</p>
                            <p style="color: hsl(224, 23%, 55%)">$59.99/year</p>
                        </div>
                    </div>
                    <a href="" style="color: hsl(245, 75%, 52%); font-weight: 800;">Change</a>
                </div>
            </div>
            <button class="payment-btn">Proceed to payment</button>
            <button class="cancel-btn">Cancel Order</button>
        </div>
    </body>
</html>
