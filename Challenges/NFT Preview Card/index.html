<!DOCTYPE html>
<html>
    <head>
        <title>NFT Preview Card</title>
        <link href="style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="card">
            <div>
                <img src="Assets/image-equilibrium.jpg" class="img"/>
            </div>
            <div class="card-content">
                <h2 class="head">Equilibrium #3429</h2>
                <p class="para">Our Equilibrium collection promotes balance and calm.</p>
                <div class="info">
                    <div class="eth">
                        <img src="Assets/icon-ethereum.svg" />
                        <p class="eth-text">0.041 ETH</p>
                    </div>
                    <div class="eth">
                        <img src="Assets/icon-clock.svg" />
                        <p class="eth-time">3 days left</p>
                    </div>
                </div>
            </div>
            <hr>
            <div class="card-avatar">
                <img src="Assets/image-avatar.png" class="avatar"/>
                <p class="avatar-text">Creation of <span>Jules Wyvern</span></p>
            </div>
        </div>
    </body>
</html>
